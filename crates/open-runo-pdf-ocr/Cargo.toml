[package]
name = "open-runo-pdf-ocr"
description = "Shared by the aon-co-jp pdf-r2l apps: render PDF pages (pure Rust), OCR them through aruaru-llm (POST /v1/ocr), detect the typeface style (gothic/mincho, bold) and rebuild every recognised line as real, searchable text in a matching embedded Noto font."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
lopdf = "0.34"
hayro = { version = "0.8", features = ["embed-fonts"] }
ureq = "3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsetter = "0.2"
ttf-parser = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
open-runo-glyph = { path = "../open-runo-glyph" }
open-runo-sr = { path = "../open-runo-sr" }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
