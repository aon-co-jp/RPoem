[package]
name = "open-runo-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "open-runo admin gRPC: the .proto (single source of truth), generated prost messages, JSON<->Struct helpers, and gRPC / gRPC-web framing shared by the server, CLI, admin UI (WASM) and callers"

[lints]
workspace = true

[dependencies]
prost = "0.14"
prost-types = "0.14"
serde_json = { workspace = true }

bytes = { version = "1.9", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.10", features = ["http2", "client"], optional = true }
hyper-util = { version = "0.1", features = ["tokio"], optional = true }
tokio = { workspace = true, optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring"] }
rustls-pemfile = { version = "2.2", optional = true }
webpki-roots = { version = "1", optional = true }

[features]
# gRPCクライアント(CLI・呼び出し側用。wasm32では使わない)。HTTP/2、https://はTLS1.3のみ。
client = ["dep:bytes", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:tokio", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:webpki-roots"]

[build-dependencies]
protox = "0.10"
prost-build = "0.14"
prost = "0.14"
