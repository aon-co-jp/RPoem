[package]
name = "open-runo-poem-compat"
version.workspace = true
edition.workspace = true
description = "外部プロジェクトがpoemクレートの代わりにRPoemを直接利用できるようにする、poem互換API面(Route::at/get/post/Server::new/Json等)の薄いファサード。実体はopen-runo-router::hyper_compat(tokio/hyper)のラッパーであり、poem本体には依存しない。"

[dependencies]
open-runo-router = { path = "../open-runo-router" }
open-runo-openapi = { path = "../open-runo-openapi" }
hyper = { version = "1.10", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
tokio = { workspace = true }
bytes = "1.9"
http-body-util = "0.1"
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = "0.7"
# クエリの配列(?a=1&a=2)を Vec で受けるため。serde_urlencoded と同じ書き味で配列も読める。
serde_html_form = "0.4"
futures = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
open-runo-poem-compat-macro = { path = "../open-runo-poem-compat-macro" }
tokio-tungstenite = "0.30"

[features]
# TLS termination(rustls) — open-runo-router::hyper_compat::tlsをそのまま
# 転送するだけ(2026-08-25追加、open-english world-lab Phase B対応)。
# 独自のTLS/暗号実装は一切追加しない——既存の`hyper_compat::tls`
# (rustls、証明書チェーン+秘密鍵をPEMファイルからロードするだけの
# 薄いラッパー)をfeature経由で有効化できるようにするのみ。
tls = ["open-runo-router/tls"]
