[package]
name = "open-runo-connect-server"
description = "gRPC-web-Connect server: one handler that serves gRPC, gRPC-web, gRPC-web-text and Connect (proto/JSON, unary/server-streaming) on the same path, over hyper."
version.workspace = true
edition.workspace = true
license = "Apache-2.0 OR MIT"
rust-version.workspace = true

[lints.rust]
unsafe_code = "deny"

[features]
default = ["json"]
# Connect / gRPC-web の JSON コーデック(proto3-JSON)。記述子から prost-reflect で変換する。
json = ["dep:prost-reflect"]

[dependencies]
open-runo-connect-core = { path = "../open-runo-connect-core" }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
http-body-util = "0.1"
hyper = { version = "1", default-features = false }
prost-reflect = { version = "0.16", features = ["serde"], optional = true }
serde_json = "1"

[dev-dependencies]
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["full"] }
