[workspace]
members = [
    "crates/open-runo-core",
    "crates/open-runo-router",
    "crates/open-runo-poem-compat",
    "crates/open-runo-poem-compat-macro",
    "crates/open-runo-openapi",
    "crates/open-runo-federation",
    "crates/open-runo-schema-registry",
    "crates/open-runo-ai-routing",
    "crates/open-runo-versionless-api",
    "crates/open-runo-appserver",
    "crates/open-runo-view",
    "crates/open-runo-db",
    "crates/open-runo-backup",
    "crates/open-runo-history",
    "crates/open-runo-observability",
    "crates/open-runo-security",
    "crates/open-runo-gateway",
    "crates/open-runo-persisted-queries",
    "crates/open-runo-scim",
    "crates/open-runo-cache",
    "crates/open-runo-cli",
    "crates/open-runo-api-types",
    "crates/open-runo-feature-flags",
    "crates/open-runo-rustjson",
    "crates/open-runo-tls-fingerprint",
    "crates/open-runo-voice",
    "crates/open-runo-pdf-ocr",
    "crates/open-runo-sr",
    "crates/open-runo-glyph",
    "crates/open-runo-crossui",
]

resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["open-runo Contributors"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aon-co-jp/open-runo"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
# 2026-10-28: poem/poem-derive/indexmap の厳密ピンを解除(rust-version を 1.88 へ上げ、
# edition2024 を要求する最新の依存を許容する。lopdf 0.46 が indexmap 2.14+ を要求するため)。
poem = { version = "3.1", features = ["sse"] }
poem-derive = "3.1"
indexmap = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "chrono", "uuid"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
async-trait = "0.1"
lazy_static = "1.4"
regex = "1.10"
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.34"
jsonwebtoken = { version = "11.1", features = ["use_pem", "rust_crypto"] }
jsonschema = "0.60"
once_cell = "1.20"
async-graphql = "7.0"
async-graphql-poem = "7.0"
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
schemars = "1.2"
toml = "1.1"
flate2 = "1.0"

# open-runo crates (path deps, shared across workspace members)
open-runo-core = { path = "crates/open-runo-core" }
open-runo-router = { path = "crates/open-runo-router" }
open-runo-federation = { path = "crates/open-runo-federation" }
open-runo-schema-registry = { path = "crates/open-runo-schema-registry" }
open-runo-ai-routing = { path = "crates/open-runo-ai-routing" }
open-runo-versionless-api = { path = "crates/open-runo-versionless-api" }
open-runo-appserver = { path = "crates/open-runo-appserver" }
open-runo-view = { path = "crates/open-runo-view" }
open-runo-db = { path = "crates/open-runo-db" }
open-runo-backup = { path = "crates/open-runo-backup" }
open-runo-history = { path = "crates/open-runo-history" }
open-runo-observability = { path = "crates/open-runo-observability" }
open-runo-security = { path = "crates/open-runo-security" }
open-runo-gateway = { path = "crates/open-runo-gateway" }
open-runo-persisted-queries = { path = "crates/open-runo-persisted-queries" }
open-runo-scim = { path = "crates/open-runo-scim" }
open-runo-cache = { path = "crates/open-runo-cache" }
open-runo-api-types = { path = "crates/open-runo-api-types" }
open-runo-openapi = { path = "crates/open-runo-openapi" }
open-runo-feature-flags = { path = "crates/open-runo-feature-flags" }

# Quality Gate: workspace-wide lint policy.
# Individual crates opt in via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

# `pedantic` is deliberately NOT enabled workspace-wide: with the CI gate
# running `-D warnings`, pedantic's stylistic nits would fail builds for
# non-functional reasons. Individual crates may opt in locally with
# `#![warn(clippy::pedantic)]` if desired.

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
debug = 1

[profile.test]
opt-level = 1
