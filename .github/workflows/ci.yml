name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 兄弟リポジトリを取得(パス依存のopen-web-serverとその依存)
        run: |
          for r in open-web-server RS-SmartTCP open-cpu open-raid-z; do
            git clone --quiet --depth 1 "https://github.com/aon-co-jp/$r.git" "../$r"
          done
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check redis backend feature
        run: cargo check -p open-runo-cache --features redis-backend
